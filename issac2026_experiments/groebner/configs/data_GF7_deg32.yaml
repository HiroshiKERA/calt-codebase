# Groebner task over GF(7), 2 variables, degree <= 32.
#
# Third row of the scale comparison, and the extreme one: the classical lex
# computation is 448x slower than degrevlex here (Table 6). Same sampler as
# data_GF7.yaml except for max_degree.
#
# Generation is markedly slower than at degree 4 and the resulting bases are
# long; see configs/train_GF7_deg32.yaml for the matching sequence budget.

sampler:
  symbols: "x,y"
  field_str: "GF7"
  order: "degrevlex"
  max_num_terms: 5
  max_degree: 32
  min_degree: 1
  max_coeff: 0         # not used for finite fields
  degree_sampling: "uniform"
  term_sampling: "uniform"

problem_generator:
  num_polynomials: 2

dataset:
  save_dir: "./data/GF7_deg32"
  num_train_samples: 100000
  num_test_samples: 1000
  batch_size: 10000
  n_jobs: 32
  root_seed: 42
  verbose: true
  backend: "sagemath"
  save_text: true
  save_json: false
