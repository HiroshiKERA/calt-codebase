model:
  model_type: generic
  num_encoder_layers: 6
  num_encoder_heads: 8
  num_decoder_layers: 6
  num_decoder_heads: 8
  d_model: 512
  encoder_ffn_dim: 2048
  decoder_ffn_dim: 2048
  # Degree 32 lexicographic bases are the longest sequences in this experiment.
  # If training reports truncated targets, raise this before reading anything
  # into the success rate: a truncated target can never be matched exactly.
  max_sequence_length: 4096

train:
  save_dir: ./results/GF7_deg32
  num_train_epochs: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  # Halved against train_GF7.yaml because the sequences are ~2x longer; raise
  # gradient_accumulation_steps to keep the effective batch at 128 if the
  # comparison against the degree 4 row should hold the optimizer fixed.
  batch_size: 64
  gradient_accumulation_steps: 2
  test_batch_size: 64
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  num_workers: 4
  seed: 42
  wandb:
    project: calt-issac26
    group: groebner
    name: groebner_GF7_deg32
    no_wandb: False

data:
  train_dataset_path: ./data/GF7_deg32/train_raw.txt
  test_dataset_path: ./data/GF7_deg32/test_raw.txt
  lexer_config: ./configs/lexer.yaml
  validate_train_tokens: true
  validate_test_tokens: true
