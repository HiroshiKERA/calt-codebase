model:
  model_type: generic
  num_encoder_layers: 6
  num_encoder_heads: 8
  num_decoder_layers: 6
  num_decoder_heads: 8
  d_model: 512
  encoder_ffn_dim: 2048
  decoder_ffn_dim: 2048
  # Degree 16 bases are longer than the degree 4 ones of train_GF7.yaml; keep
  # the same budget, which already covers them with room to spare.
  max_sequence_length: 2048

train:
  save_dir: ./results/GF7_deg16
  num_train_epochs: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 128
  test_batch_size: 128
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  num_workers: 4
  seed: 42
  wandb:
    project: calt-issac26
    group: groebner
    name: groebner_GF7_deg16
    no_wandb: False

data:
  train_dataset_path: ./data/GF7_deg16/train_raw.txt
  test_dataset_path: ./data/GF7_deg16/test_raw.txt
  lexer_config: ./configs/lexer.yaml
  validate_train_tokens: true
  validate_test_tokens: true
