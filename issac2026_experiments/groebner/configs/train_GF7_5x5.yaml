model:
  model_type: generic
  num_encoder_layers: 6
  num_encoder_heads: 8
  num_decoder_layers: 6
  num_decoder_heads: 8
  d_model: 512
  encoder_ffn_dim: 2048
  decoder_ffn_dim: 2048
  # Five polynomials in five variables: the input alone is ~2.5x the 2-variable
  # setting, and the lexicographic bases of a square system are the long ones.
  max_sequence_length: 4096

train:
  save_dir: ./results/GF7_5x5
  num_train_epochs: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 4
  gradient_accumulation_steps: 32
  test_batch_size: 8
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  num_workers: 4
  seed: 42
  wandb:
    project: calt-issac26
    group: groebner
    name: groebner_GF7_5x5
    no_wandb: False

data:
  train_dataset_path: ./data/GF7_5x5/train_raw.txt
  test_dataset_path: ./data/GF7_5x5/test_raw.txt
  # Five variables, so the extended symbol set.
  lexer_config: ./configs/lexer_5x5.yaml
  validate_train_tokens: true
  validate_test_tokens: true
