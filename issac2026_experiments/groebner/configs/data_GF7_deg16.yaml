# Groebner task over GF(7), 2 variables, degree <= 16.
#
# Second row of the scale comparison: the classical lex/degrevlex time ratio is
# 4.7x here (Table 6), against 1.15x at degree 4, so this is the first setting
# where the computer-algebra gap is real. Same sampler as data_GF7.yaml except
# for max_degree.

sampler:
  symbols: "x,y"
  field_str: "GF7"
  order: "degrevlex"
  max_num_terms: 5
  max_degree: 16
  min_degree: 1
  max_coeff: 0         # not used for finite fields
  degree_sampling: "uniform"
  term_sampling: "uniform"

problem_generator:
  num_polynomials: 2

dataset:
  save_dir: "./data/GF7_deg16"
  num_train_samples: 100000
  num_test_samples: 1000
  batch_size: 10000
  n_jobs: 32
  root_seed: 42
  verbose: true
  backend: "sagemath"
  save_text: true
  save_json: false
