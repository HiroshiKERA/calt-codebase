# Dataset generation config — see core/generator.py for what these control.

# Passed to TaskGenerator(**problem_generator) by scripts/generate.py.
problem_generator: {}        # TODO: your generator's parameters

dataset:
  save_dir: "../data"
  num_train_samples: 1000    # TODO: adjust for your task
  num_test_samples: 200
  batch_size: 1000           # samples generated per batch
  n_jobs: 4                  # parallel worker processes
  root_seed: 42
  verbose: true
  backend: "sagemath"        # "sagemath" or "sympy" (use "sympy" if you don't need SageMath)
  save_text: true
  save_json: false
